name: Deterministic tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Syntax check
        run: |
          node --check bin/docflow.js
          node --check bin/install-global.js
          node --check scripts/setup.js
          node --check src/core.js
          node --check src/state-store.js
          node --check src/install.js
          node --check src/doctor.js
          node --check src/cli.js
